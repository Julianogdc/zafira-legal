server {
    listen 80;
    server_name localhost legal.zafiramkt.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de Segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip para máxima leveza e velocidade
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Roteamento correto para arquivos diretos, extensão .html implícita e fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Cache para arquivos estáticos
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Tratamento de erro 404
    error_page 404 /index.html;
}
